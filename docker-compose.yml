services:
  db:
    image: mysql:8.0
    env_file: .env
    command: --default-time-zone=+09:00
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db

volumes:
  db_data:
  uploads: