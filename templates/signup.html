{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}
<section class="page-heading">
  <span class="eyebrow">SIGN UP</span>
  <h1>회원가입</h1>
  <p>커뮤니티에 가입하고 글을 남겨보세요.</p>
</section>

<section class="form-panel">
  <form class="post-form" method="post">
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <div class="form-group">
      <label for="username">아이디</label>
      <input id="username" name="username" maxlength="50" required>
    </div>
    <div class="form-group">
      <label for="password">비밀번호 (8자 이상)</label>
      <input id="password" name="password" type="password" minlength="8" required>
    </div>
    <div class="form-group">
      <label for="name">이름</label>
      <input id="name" name="name" maxlength="50" required>
    </div>
    <div class="form-group">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" maxlength="100" required>
    </div>
    <div class="form-group">
      <label for="school">학교 <span class="muted">(선택)</span></label>
      <input id="school" name="school" maxlength="100">
    </div>

    <div class="form-actions">
      <button class="button primary" type="submit">가입하기</button>
    </div>
  </form>
</section>
{% endblock %}
