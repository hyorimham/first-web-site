{% extends "base.html" %}
{% block content %}
  <h2>{{ post.title }}</h2>
  <p>{{ post.created_at }}</p>
  <p>{{ post.content }}</p>

  <a href="/">목록으로</a>
  <a href="/post/{{ post.id }}/edit">수정</a>

  <form method="POST" action="/post/{{ post.id }}/delete" style="display:inline;">
    <button type="submit" class="btn-danger">삭제</button>
  </form>
{% endblock %}
