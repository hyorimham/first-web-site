{% extends "base.html" %}

{% block content %}
<h2>{{ post.title }}</h2>
<p class="post-date">{{ post.created_at }}</p>
<div style="margin: 20px 0;">
    <p>{{ post.content }}</p>
</div>

<div class="action-buttons">
    <a href="/" class="btn btn-secondary">목록으로</a>
    <form action="/post/{{ post.id }}/delete" method="POST" style="display:inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
        <button type="submit" class="btn btn-danger">삭제</button>
    </form>
</div>
{% endblock %}
