{% extends "base.html" %}

{% block title %}내 정보 수정{% endblock %}

{% block content %}
<section class="page-heading">
  <a class="back-link" href="{{ url_for('my_profile') }}">← 내 프로필로 돌아가기</a>
  <span class="eyebrow">EDIT PROFILE</span>
  <h1>내 정보 수정</h1>
</section>

<section class="form-panel">
  <form class="post-form" method="post" enctype="multipart/form-data">
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <div class="form-group">
      <label for="name">이름</label>
      <input id="name" name="name" maxlength="50" value="{{ user.name }}" required>
    </div>
    <div class="form-group">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" maxlength="100" value="{{ user.email }}" required>
    </div>
    <div class="form-group">
      <label for="school">학교 <span class="muted">(선택)</span></label>
      <input id="school" name="school" maxlength="100" value="{{ user.school }}">
    </div>
    <div class="form-group">
      <label for="profile_image">프로필 사진 <span class="muted">(png, jpg, gif / 바꿀 때만 선택)</span></label>
      <input id="profile_image" name="profile_image" type="file" accept="image/*">
    </div>

    <div class="form-actions">
      <a class="button secondary" href="{{ url_for('my_profile') }}">취소</a>
      <button class="button primary" type="submit">저장</button>
    </div>
  </form>
</section>
{% endblock %}
