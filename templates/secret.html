{% extends "base.html" %}

{% block title %}비밀글{% endblock %}

{% block content %}
<section class="page-heading">
  <a class="back-link" href="{{ url_for('board_view', board_id=post.board_id) }}">
    ← {{ post.board_name }}으로 돌아가기
  </a>
  <span class="eyebrow">SECRET POST</span>
  <h1>🔒 비밀글입니다</h1>
  <p>글을 보려면 비밀번호를 입력하세요.</p>
</section>

<section class="form-panel">
  <form class="post-form" method="post">
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <div class="form-group">
      <label for="secret_pw">비밀번호</label>
      <input id="secret_pw" name="secret_pw" type="password" required>
    </div>

    <div class="form-actions">
      <button class="button primary" type="submit">확인</button>
    </div>
  </form>
</section>
{% endblock %}
